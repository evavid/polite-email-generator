[project]
name = "polite-email"
version = "2.0.0"
description = "LangGraph agent that drafts polite emails, checks the tone and revises until it passes, with a human approval step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-anthropic>=1.7",
    "langchain-core>=1.6",
    "langsmith>=0.14",
    "python-dotenv>=1.2",
]

[project.scripts]
polite-email = "polite_email.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polite_email"]

[tool.pytest.ini_options]
testpaths = ["tests"]
